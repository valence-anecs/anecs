name: anecs-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ANECS_POSTGRES_DB:-anecs}
      POSTGRES_USER: ${ANECS_POSTGRES_USER:-anecs}
      POSTGRES_PASSWORD: ${ANECS_POSTGRES_PASSWORD:?Set ANECS_POSTGRES_PASSWORD in .env}
    ports:
      - "${ANECS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - anecs-postgres:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-anecs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANECS_POSTGRES_USER:-anecs} -d ${ANECS_POSTGRES_DB:-anecs}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  anecs-postgres:
